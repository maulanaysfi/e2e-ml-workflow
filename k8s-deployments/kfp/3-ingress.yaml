apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kf-pipeline-ui
  namespace: kubeflow
  annotations:
    cert-manager.io/cluster-issuer: "local-clusterissuer"
spec:
  ingressClassName: nginx
  rules:
    - host: kf.maulanaysfi.my.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ml-pipeline-ui
                port:
                  number: 80
  tls:
    - hosts:
        - kf.maulanaysfi.my.id
      secretName: kf-ing-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kf-pipeline
  namespace: kubeflow
  annotations:
    cert-manager.io/cluster-issuer: "local-clusterissuer"
spec:
  ingressClassName: nginx
  rules:
    - host: kf-api.maulanaysfi.my.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ml-pipeline
                port:
                  number: 8888
  tls:
    - hosts:
        - kf-api.maulanaysfi.my.id
      secretName: kf-api-ing-tls
