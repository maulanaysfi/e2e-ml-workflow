image:
  registry: registry-1.docker.io
  repository: bitnami/postgresql
  tag: latest

auth:
  enablePostgresUser: true
  postgresPassword: "wazowski12344321"
  username: "ml-worflow"
  password: "wazowski"
  database: "ml-worflow"
  replicationUsername: repl_user
  usePasswordFiles: true

containerPorts:
  postgresql: 5432

shmVolume:
  enabled: true
  sizeLimit: 1Gi

primary:
  name: postgres
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  service:
    type: LoadBalancer
    ports:
      postgresql: 5432
    clusterIP: ""
    loadBalancerIP: ""
  persistence:
    enabled: true
    storageClass: "nfs-sep"
    accessModes:
      - ReadWriteOnce
    size: 20Gi
  persistentVolumeClaimRetentionPolicy:
    enabled: true
    whenScaled: Retain
    whenDeleted: Delete

readReplicas:
  name: read
  replicaCount: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 400m
      memory: 1Gi

  service:
    type: ClusterIP
    ports:
      postgresql: 5432
    clusterIP: None
    externalTrafficPolicy: Cluster
  persistence:
    enabled: true
    storageClass: "nfs-sep"
    accessModes:
      - ReadWriteOnce
    size: 8Gi
  persistentVolumeClaimRetentionPolicy:
    enabled: true
    whenScaled: Retain
    whenDeleted: Delete
